name: mirror-drift

on:
  pull_request:
    paths: ['routines/**']
  push:
    branches: [main]
    paths: ['routines/**']

permissions:
  contents: read

jobs:
  precheck-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PRODUCER_PRECHECK mirrors match the canonical
        shell: pwsh
        run: ./scripts/check-precheck-mirror.ps1 -Root routines
