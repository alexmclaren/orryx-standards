# Claude Code Governance Configuration
# Version: 1.0.0
# Last Updated: 2026-05-18
#
# This is the MASTER governance configuration for the Orryx ecosystem.
# It coordinates all governance systems:
#   - Context management
#   - Read-before-edit enforcement
#   - Execution budgets and retry limits
#   - Memory freshness
#   - Quality gates

version: "1.0.0"

# ============================================================================
# GOVERNANCE PHILOSOPHY
# ============================================================================
#
# Goals:
#   1. Prevent wasteful token usage
#   2. Enforce best practices proactively
#   3. Catch issues early (pre-commit, pre-edit, pre-planning)
#   4. Learn from past mistakes via Pinecone memory
#   5. Fail fast when stuck, escalate intelligently
#
# Principles:
#   - A level is a claim about what runs, not about what matters.
#   - "hard" requires an executable that exists, is registered, blocks on
#     failure, and has a test proving it blocks. All four, or it is not hard.
#   - Everything else is "documented": a rule a human or agent is expected to
#     follow. Honest, useful, and not pretending to be a gate.
#   - This file must describe reality. `scripts/check-governance-hooks.mjs`
#     enforces that in CI.
#
# Amended 2026-08-09 (see decisions/, and orryx-control-plane
# docs/pilot/PLAN-2026-08-09-executor-boundary-next.md §A):
#
# From 2026-05-18 to 2026-08-09 this file declared thirteen hooks, four systems
# at enforcement_level "hard" and can_override: false. Nine of the thirteen
# scripts were never written — git shows zero commits for those filenames across
# all refs — and no settings.json has ever existed in this repository, so the
# four that do exist never fired either. Every "hard" was a string.
#
# The nine declarations are removed rather than stubbed: nothing was deleted, so
# there is nothing to recover, and five of them named lifecycle phases
# (pre_planning, pre_debugging, post_story) that have no counterpart in Claude
# Code's tool- and session-scoped event model, so they could not have been built
# as declared at any effort. execution-budget-check is not missing but moved: it
# shipped as orryx-control-plane executor/src/budget.js, enforced by the control
# plane's own clock.
#
# Intent for the rest is tracked in HA-070, not in a field that lies.

# ============================================================================
# GOVERNANCE SYSTEMS
# ============================================================================

# Every system is "documented" as of 2026-08-09. None has an executable that
# blocks, so none may claim "hard" — see ENFORCEMENT LEVELS below. A system earns
# "hard" back by shipping a registered, blocking hook with a test, one at a time.
systems:
  context_management:
    enabled: true
    config_file: ".claude/config/context-budget.yaml"
    enforcement_level: "documented"  # hard | documented
    description: "Token budgets and context-bloat guidance"

  read_before_edit:
    enabled: true
    config_file: ".claude/config/read-before-edit.yaml"
    enforcement_level: "documented"
    description: "Mandates exploration before file modifications"
    # Nearest to earning "hard": PreToolUse on Edit|Write is a real event and the
    # rule is already in CLAUDE.base.md §11. Tracked in HA-070.

  execution_budgets:
    enabled: true
    config_file: ".claude/config/execution-budgets.yaml"
    enforcement_level: "documented"
    description: "Retry limits and loop detection"
    # Enforced for delegated execution by orryx-control-plane
    # executor/src/budget.js, against the control plane's own clock. This file
    # remains guidance for interactive sessions.

  memory_integration:
    enabled: true
    config_file: ".claude/config/memory-freshness.yaml"
    enforcement_level: "documented"
    description: "Pinecone memory retrieval and freshness management"

  secret_scanning:
    enabled: true
    enforcement_level: "hard"
    gate: ".github/workflows/governance.yml"
    description: "Gitleaks, full working tree, blocking on push and PR"
    # The first system in this repository to earn "hard": the gate exists, is
    # registered in CI, exits non-zero on a finding, and self-tests against a
    # known-bad fixture before trusting a clean result. Config is .gitleaks.toml,
    # adopted 2026-08-09 from this repo's own templates/gitleaks.template.toml.

  quality_gates:
    enabled: true
    enforcement_level: "documented"
    description: "Lint, types and tests — not yet gated anywhere"
    # Security split out above as secret_scanning, which is now hard. The other
    # three stay documented and belong in the repositories that have code to
    # check, not here: this repo is 96 markdown files and 17 unwired TypeScript
    # scripts, so linting and type-checking it would gate almost nothing.
    # Shipping a reusable workflow for consuming repos is HA-070 follow-on.
    #
    # Note while here: .claude/hooks/package.json declares `test: tsx
    # test-hooks.ts` and no test-hooks.ts exists — the same
    # declared-but-absent pattern this commit is cleaning up.

  codeburn_monitoring:
    enabled: true
    config_file: ".claude/config/codeburn.yaml"
    enforcement_level: "documented"
    description: "Session monitoring and alerts"

# ============================================================================
# ENFORCEMENT LEVELS
# ============================================================================

# Two levels, because only two are observable. "soft" and "warn" were removed on
# 2026-08-09: nothing read this file, so the difference between blocking-with-
# override and warning-then-continuing had never once been visible in practice.
#
# Removing a level here mechanically retires every claim to it —
# check-governance-hooks.mjs fails on any enforcement_level not declared below.
enforcement_levels:
  hard:
    description: >
      Blocks execution until resolved. Requires ALL of: the executable exists,
      it is registered in a settings.json or workflow, it exits non-zero on
      failure, and a test asserts that it blocks. Absent any one, use
      "documented" instead — a level is a claim about what runs.
    can_override: false
    logs: true
    alerts: true

  documented:
    description: >
      A rule a human or agent is expected to follow, recorded in CLAUDE.base.md
      or a config file, with nothing that enforces it automatically. Not a gate,
      and must not be described as one.
    can_override: true
    requires_justification: false
    logs: false
    alerts: false

# ============================================================================
# HOOK ORCHESTRATION
# ============================================================================
#
# Defines when hooks are triggered and in what order

# NOTHING HERE IS REGISTERED WITH CLAUDE CODE.
#
# Claude Code discovers hooks through a settings.json and nothing else, and no
# settings.json has ever existed in this repository. The four scripts below are
# real files, invoked manually via `npm run` from .claude/hooks/package.json —
# useful, but they are scripts, not hooks. `enabled: false` says so.
#
# The phase names below (pre_planning, pre_edit, pre_debugging, post_story) are
# this file's own vocabulary and do NOT correspond to Claude Code events, which
# are tool- and session-scoped: PreToolUse, PostToolUse, UserPromptSubmit, Stop,
# SessionStart, SessionEnd, PreCompact, Notification. Only pre_edit (PreToolUse,
# matcher Edit|Write) and post_story (Stop/SessionEnd) have a mapping at all.
# Anything registered here must be re-expressed in that vocabulary first.
hooks:
  # Before Planning
  pre_planning:
    - name: "memory-retrieval"
      script: ".claude/hooks/pre-planning-memory-retrieval.ts"
      enabled: false  # exists; not registered; no Claude Code "planning" event
      blocking: false
      timeout_seconds: 30

  # Before Edit
  pre_edit:
    - name: "memory-retrieval"
      script: ".claude/hooks/pre-edit-memory-retrieval.ts"
      enabled: false  # exists; not registered. Maps to PreToolUse Edit|Write.
      blocking: false
      timeout_seconds: 20

  # Before Debugging
  pre_debugging:
    - name: "memory-retrieval"
      script: ".claude/hooks/pre-debugging-memory-retrieval.ts"
      enabled: false  # exists; not registered; no Claude Code "debugging" event
      blocking: false
      timeout_seconds: 30

  # After Story
  post_story:
    - name: "memory-write"
      script: ".claude/hooks/post-story-memory-write.ts"
      enabled: false  # exists; not registered. Maps to Stop/SessionEnd.
      blocking: false
      timeout_seconds: 60

# ============================================================================
# ESCALATION RULES
# ============================================================================

escalation:
  # When to escalate to human
  triggers:
    - condition: "retry_count > max_retries"
      action: "block_and_escalate"
      message: "Maximum retry attempts exceeded. Human intervention required."

    - condition: "confidence_score < 0.3"
      action: "warn_and_escalate"
      message: "Low confidence in solution. Human review recommended."

    - condition: "cost_budget_exceeded"
      action: "block_and_escalate"
      message: "Cost budget exceeded for this task."

    - condition: "loop_detected"
      action: "block_and_escalate"
      message: "Infinite loop detected. Same error recurring."

    - condition: "critical_domain_change"
      action: "require_human_review"
      message: "Changes to critical domain require human approval."

  # Critical domains requiring human review
  critical_domains:
    - authentication
    - authorization
    - payment
    - data-migration
    - patient-data
    - clinical-logic
    - compliance
    - privacy
    - security

# ============================================================================
# LOGGING & MONITORING
# ============================================================================

logging:
  enabled: true
  log_dir: ".claude/logs"

  levels:
    governance: "info"      # Governance decisions
    hooks: "info"           # Hook execution
    memory: "debug"         # Memory operations
    metrics: "info"         # Session metrics
    errors: "error"         # Errors and failures

  outputs:
    - type: "file"
      path: ".claude/logs/governance.log"
      rotation: "daily"
      retention_days: 30

    - type: "jsonl"
      path: ".claude/logs/governance.jsonl"
      rotation: "daily"
      retention_days: 90

monitoring:
  enabled: true

  metrics:
    - name: "context_budget_usage"
      threshold: 0.8
      alert_on_exceed: true

    - name: "retry_count"
      threshold: 5
      alert_on_exceed: true

    - name: "read_to_edit_ratio"
      threshold: 2.0
      alert_on_below: true

    - name: "session_cost"
      threshold: 25.0
      alert_on_exceed: true

  alerts:
    - type: "log"
      enabled: true

    - type: "dashboard"
      enabled: true
      dashboard_file: "docs/governance/DASHBOARD.md"

# ============================================================================
# OVERRIDE MANAGEMENT
# ============================================================================

overrides:
  enabled: true
  requires_justification: true
  log_all_overrides: true

  # Who can override what
  permissions:
    human:
      can_override:
        - soft_gates
        - warn_gates
      cannot_override:
        - hard_gates_security
        - hard_gates_compliance

    agent:
      can_override:
        - warn_gates
      cannot_override:
        - soft_gates
        - hard_gates

# ============================================================================
# GOVERNANCE DASHBOARD
# ============================================================================

dashboard:
  enabled: true
  auto_update: true
  update_frequency: "daily"
  output_file: "docs/governance/DASHBOARD.md"

  sections:
    - name: "Health Score"
      metrics:
        - context_budget_health
        - read_to_edit_ratio
        - retry_count_avg
        - quality_gates_pass_rate

    - name: "Violations"
      shows:
        - top_10_violations_by_type
        - recent_escalations
        - override_usage

    - name: "Trends"
      shows:
        - 7_day_trend
        - 30_day_trend
        - month_over_month_comparison

# ============================================================================
# REPOSITORY-SPECIFIC OVERRIDES
# ============================================================================
#
# Repos can override governance settings by creating:
#   {repo}/.claude/config/governance.local.yaml
#
# Example:
#   systems:
#     execution_budgets:
#       enforcement_level: "soft"  # Override to soft for this repo

include_local_overrides: true
local_override_file: ".claude/config/governance.local.yaml"

# ============================================================================
# FEATURE FLAGS
# ============================================================================

feature_flags:
  # Gradual rollout of new governance features
  strict_context_enforcement:
    enabled: true
    rollout_percentage: 100

  anti_loop_detection:
    enabled: true
    rollout_percentage: 100

  auto_compaction:
    enabled: true
    rollout_percentage: 100

  pinecone_auto_retrieval:
    enabled: true
    rollout_percentage: 100

# ============================================================================
# HEALTH CHECKS
# ============================================================================

health_checks:
  enabled: true
  frequency: "hourly"

  checks:
    - name: "pinecone_connection"
      critical: false
      alert_on_failure: true

    - name: "config_files_valid"
      critical: true
      alert_on_failure: true

    - name: "hook_scripts_exist"
      critical: true
      alert_on_failure: true

    - name: "log_directory_writable"
      critical: false
      alert_on_failure: true

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
